name: Image Security

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Scan published image for fixable vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-ref: ghcr.io/atomantic/critical-mass:${{ inputs.release_tag || 'latest' }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          output: trivy-results.txt
        env:
          TRIVY_IMAGE_SRC: remote
          TRIVY_PLATFORM: linux/amd64

      - name: Report vulnerability scan results
        if: ${{ !cancelled() && hashFiles('trivy-results.txt') != '' }}
        run: |
          {
            printf '### Fixable HIGH and CRITICAL vulnerabilities (linux/amd64)\n\n```text\n'
            cat trivy-results.txt
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"
