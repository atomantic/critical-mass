name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's superseded run. Push runs
# are never cancelled: Release triggers from a completed main run. Push runs get
# a per-commit group because a shared group would still cancel a *pending* run
# when a newer one queues, even with cancel-in-progress false.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: npm test

  admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix admin

      - name: Run admin render tests
        run: npm run test:admin

      - name: Lint admin
        run: npm run lint:admin

      - name: Build admin UI
        run: npm run build

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck -- --strict-ratchet

  build:
    # Preserve the check name configured in the main branch ruleset.
    name: build (26.x)
    runs-on: ubuntu-latest
    needs: [backend-tests, admin, typecheck]
    if: ${{ always() }}
    steps:
      - name: Require all CI jobs to succeed
        env:
          BACKEND: ${{ needs.backend-tests.result }}
          ADMIN: ${{ needs.admin.result }}
          TYPECHECK: ${{ needs.typecheck.result }}
        run: |
          printf 'Backend tests: %s\nAdmin: %s\nTypecheck: %s\n' "$BACKEND" "$ADMIN" "$TYPECHECK"
          [[ "$BACKEND" == success && "$ADMIN" == success && "$TYPECHECK" == success ]]
