name: Docker Build

on:
  workflow_call:
    inputs:
      release_tag:
        description: Existing immutable release tag to publish or recover
        required: true
        type: string
      publish_latest:
        description: Also move the latest tag to this release (only newly-created releases should set this)
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable release tag to publish or recover
        required: true
        type: string

permissions: {}

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            cache: buildkit
          - arch: arm64
            runner: ubuntu-24.04-arm
            cache: buildkit-arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.release_tag }}
          persist-credentials: false

      - name: Verify immutable release tag
        id: source
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a version tag such as v2.26.1: $RELEASE_TAG" >&2
            exit 1
          fi

          TAG_COMMIT="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          CHECKED_OUT_COMMIT="$(git rev-parse HEAD)"
          if [ "$TAG_COMMIT" != "$CHECKED_OUT_COMMIT" ]; then
            echo "Checked out commit does not match $RELEASE_TAG" >&2
            echo "tag=$TAG_COMMIT checkout=$CHECKED_OUT_COMMIT" >&2
            exit 1
          fi

          echo "revision=$TAG_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        env:
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Build and push by digest
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.release_tag }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}

      - name: Record image digest and revision
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          REVISION: ${{ steps.source.outputs.revision }}
        run: printf '%s %s\n' "$DIGEST" "$REVISION" > image.txt

      - name: Upload image digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digest-${{ matrix.arch }}
          path: image.txt
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish-manifest:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
    steps:
      - name: Download image digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-digest-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Login to GitHub Container Registry
        env:
          REGISTRY_USER: ${{ github.repository_owner }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Publish multi-arch manifest
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH_LATEST: ${{ inputs.publish_latest }}
        run: |
          set -euo pipefail

          read -r AMD64_DIGEST AMD64_REVISION < image-digest-amd64/image.txt
          read -r ARM64_DIGEST ARM64_REVISION < image-digest-arm64/image.txt
          if [[ -z "$AMD64_REVISION" || "$AMD64_REVISION" != "$ARM64_REVISION" ]]; then
            echo "::error::Release build revisions differ or are missing"
            exit 1
          fi
          for DIGEST in "$AMD64_DIGEST" "$ARM64_DIGEST"; do
            if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "::error::Missing or invalid image digest"
              exit 1
            fi
          done
          tags=(--tag "${IMAGE}:${RELEASE_TAG}")
          if [[ "$PUBLISH_LATEST" == true ]]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${AMD64_DIGEST}" "${IMAGE}@${ARM64_DIGEST}"

      - name: Verify multi-arch manifest
        env:
          IMAGE_REF: ghcr.io/${{ github.repository }}:${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          MANIFEST="$(docker buildx imagetools inspect --raw "$IMAGE_REF")"
          echo "$MANIFEST"
          for ARCH in amd64 arm64; do
            if ! jq -e --arg arch "$ARCH" 'any(.manifests[]; .platform.os == "linux" and .platform.architecture == $arch)' <<< "$MANIFEST" >/dev/null; then
              echo "::error::${IMAGE_REF} is missing platform linux/${ARCH}"
              exit 1
            fi
          done
