name: Release

# Runs only after the CI workflow completes on a main push, so a release is never
# tagged from a commit whose tests failed. workflow_run executes the default
# branch's copy of this file against the default ref, so every step below must
# use the CI run's head_sha rather than the workflow's own commit context.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Act only on successful push-to-main CI runs, never on pull_request runs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.package-version.outputs.release_tag }}
      release_created: ${{ steps.tag-check.outputs.exists == 'false' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # No setup-node: this job installs nothing, and the runner's preinstalled
      # Node only reads package.json's version.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag-check
        run: |
          if git rev-parse "v${{ steps.package-version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        id: changelog
        if: steps.tag-check.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.package-version.outputs.version }}"
          CHANGELOG_FILE=".changelogs/v${VERSION}.md"

          if [ -f "$CHANGELOG_FILE" ]; then
            CHANGELOG=$(cat "$CHANGELOG_FILE")
          else
            PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || git rev-list --max-parents=0 HEAD)
            COMMIT_LOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s" --no-merges | grep -v "\[skip ci\]" | head -50)

            CHANGELOG="# Release v${VERSION}

          ## Changes

          ${COMMIT_LOG}

          ## Installation

          Follow the [installation guide](https://github.com/atomantic/critical-mass/blob/v${VERSION}/README.md#installation) for this release, including operator authentication setup.
          Then configure [exchange API keys and bot settings](https://github.com/atomantic/critical-mass/blob/v${VERSION}/README.md#configuration) and follow the [dashboard startup instructions](https://github.com/atomantic/critical-mass/blob/v${VERSION}/README.md#usage)."
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.tag-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.package-version.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.changelog }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" --target "$RELEASE_SHA"

  publish-image:
    name: Publish release image
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/docker-build.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      publish_latest: true
    permissions:
      contents: read
      packages: write
