name: Release

# Runs only after the CI workflow completes on a main push, so a release is never
# tagged from a commit whose tests failed. workflow_run executes the default
# branch's copy of this file against the default ref, so every step below must
# use the CI run's head_sha rather than the workflow's own commit context.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Act only on successful push-to-main CI runs, never on pull_request runs.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip ci]')
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.package-version.outputs.release_tag }}
      release_created: ${{ steps.tag-check.outputs.exists == 'false' }}
      promote_latest: ${{ steps.latest-check.outputs.promote }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # No setup-node: this job installs nothing, and the runner's preinstalled
      # Node only reads package.json's version.
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version from package.json
        id: package-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "release_tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag-check
        env:
          TAG: ${{ steps.package-version.outputs.release_tag }}
        run: |
          if git ls-remote --exit-code --tags --refs origin "refs/tags/$TAG" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              exit "$status"
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # Fail before any tag exists when a new version has no release notes.
      # A no-op for ordinary merges, where the version's tag already exists.
      - name: Require release notes for new version
        if: steps.tag-check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          if [ ! -f ".changelogs/v${VERSION}.md" ]; then
            echo "::error::package.json is at new version ${VERSION} but .changelogs/v${VERSION}.md is missing. Run 'node scripts/fold-changelog.js ${VERSION}' (see docs/RELEASING.md). No tag was created."
            exit 1
          fi

      - name: Read release notes
        id: changelog
        if: steps.tag-check.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.package-version.outputs.version }}
        run: |
          {
            echo "changelog<<RELEASE_NOTES_EOF"
            cat ".changelogs/v${VERSION}.md"
            echo
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        if: steps.tag-check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.package-version.outputs.version }}
          NOTES: ${{ steps.changelog.outputs.changelog }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh release create "$TAG" --title "$TAG" --notes "$NOTES" --target "$RELEASE_SHA"

      # CI runs for quick successive version bumps can finish out of order, so
      # this run may release an older version after a newer one. Always publish
      # the versioned tag, but promote `latest` only when this version is the
      # highest stable tag on the remote (read fresh, after our tag exists).
      - name: Decide whether to promote latest
        id: latest-check
        if: steps.tag-check.outputs.exists == 'false'
        env:
          TAG: v${{ steps.package-version.outputs.version }}
        run: |
          PROMOTE="$(git ls-remote --tags --refs origin | sed 's#.*refs/tags/##' | bash scripts/should-promote-latest.sh "$TAG")"
          echo "promote=$PROMOTE" >> "$GITHUB_OUTPUT"
          echo "Promote latest for $TAG: $PROMOTE"

  publish-image:
    name: Publish release image
    needs: release
    if: ${{ needs.release.result == 'success' && needs.release.outputs.release_created == 'true' }}
    uses: ./.github/workflows/docker-build.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      publish_latest: ${{ needs.release.outputs.promote_latest == 'true' }}
    permissions:
      contents: read
      packages: write

  scan-image:
    name: Scan release image
    needs: [release, publish-image]
    uses: ./.github/workflows/image-security.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
