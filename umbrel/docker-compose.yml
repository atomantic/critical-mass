version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: critical-mass_web_1
      APP_PORT: 5570

  web:
    image: ghcr.io/atomantic/critical-mass:v2.26.1@sha256:97930e6bab3085258699cfd6f62aa9822e541379826f94eab8b3cc2449545ab6
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - AI_ALLOWED_ENDPOINTS=${AI_ALLOWED_ENDPOINTS:-}
      - AI_WORKSPACE_ROOTS=/app
