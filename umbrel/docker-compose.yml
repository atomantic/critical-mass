version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: critical-mass_web_1
      APP_PORT: 5570

  web:
    image: ghcr.io/atomantic/critical-mass:v2.31.0@sha256:e844ac24a8799d33afe2fd334c21558b68d53df49fb240e14bb34f5eb7f21a34
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 70s
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/logs:/app/logs
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - AI_ALLOWED_ENDPOINTS=${AI_ALLOWED_ENDPOINTS:-}
