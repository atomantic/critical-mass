version: "3.8"
services:
  critical-mass:
    build: .
    container_name: critical-mass
    restart: unless-stopped
    ports:
      - "127.0.0.1:5563:5563"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - OPERATOR_TOKEN=${OPERATOR_TOKEN:-}
      - AI_ALLOWED_ENDPOINTS=${AI_ALLOWED_ENDPOINTS:-}
      - AI_WORKSPACE_ROOTS=/app

networks:
  default:
    name: critical-mass-network
