version: "3.8"
services:
  critical-mass:
    build: .
    container_name: critical-mass
    restart: unless-stopped
    stop_grace_period: 40s
    ports:
      - "127.0.0.1:5570:5570"
    volumes:
      - type: bind
        source: ./data
        target: /app/data
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /app/logs
        bind:
          create_host_path: false
    environment:
      - NODE_ENV=production
      - HOST=0.0.0.0
      - AI_ALLOWED_ENDPOINTS=${AI_ALLOWED_ENDPOINTS:-}
      - AI_WORKSPACE_ROOTS=/app

networks:
  default:
    name: critical-mass-network
